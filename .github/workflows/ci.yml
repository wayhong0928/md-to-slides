name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  smoke-build:
    name: Smoke build and audit (Node 22)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    env:
      PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps)
        run: npm run audit:prod

      - name: Clean output
        run: npm run clean

      - name: Smoke build (HTML only)
        run: npm run build:sample -- --format html

      - name: Verify HTML output exists
        run: test -f output/content.example.html

      # v2.4 起手包：產生全部場合與推薦主題組合的 zip，用 unzip -t 確認每份都能正常解開；組合數從 scenarios/ 算
      - name: Build starter packs and test zips
        run: |
          npm run scenarios
          npm run starter -- --zip
          combos=$(node -e "console.log(require('./src/starter').allCombos().length)")
          count=0
          for z in output/starters/*.zip; do
            unzip -t "$z"
            count=$((count + 1))
          done
          echo "zip ${count} 份，推薦組合 ${combos} 個"
          test "$count" -eq "$combos"

      # v2.5 樣式畫廊：產生網站，核對 3 頁、每個主題一份 CSS、場合 × 主題份預覽，starters/ 底下只有同樣數量的 zip
      - name: Build style gallery
        run: |
          npm run site
          themes=$(node -e "console.log(require('./src/starter').listThemes().length)")
          scenarios=$(node -e "console.log(require('./src/scenarios').loadScenarios().scenarios.length)")
          total=$((themes * scenarios))
          echo "主題 ${themes} 個，場合 ${scenarios} 個，預覽與 zip 應各 ${total} 份"
          test "$(ls output/site/*.html | wc -l)" -eq 3
          test "$(ls output/site/data/css | wc -l)" -eq "$themes"
          test "$(find output/site/data/scenarios -name '*.html' | wc -l)" -eq "$total"
          test "$(ls output/site/starters | wc -l)" -eq "$total"
          test "$(ls output/site/starters/*.zip | wc -l)" -eq "$total"

      # v2.6 全組合檢查：每個主題 × 每個版型跑 check 與對比，加上每個場合的推薦組合；找不到瀏覽器就失敗
      - name: Check all theme, layout and scenario combinations
        run: npm run matrix

      # D6：Ubuntu 沒有預設的中文字型。裝 Noto CJK，用五個主題（襯線標題、大字、深色底、楷體標題、等寬字）build PDF，
      # 再用 pdffonts 確認每份 PDF 都嵌入了 Noto CJK 字型，沒有就讓 job 失敗。
      - name: Install CJK fonts and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          fc-list :lang=zh-tw family | head -n 5

      - name: Build showcase PDFs (scholar, classroom, midnight, notebook, terminal)
        run: |
          mkdir -p output/font-check
          for theme in scholar classroom midnight notebook terminal; do
            sed "s/^theme:.*/theme: ${theme}/" examples/showcase.md > "output/font-check/showcase-${theme}.md"
            npm run build -- "output/font-check/showcase-${theme}.md" --out output/font-check --stem "${theme}" --format pdf
            test -s "output/font-check/${theme}.pdf"
          done

      - name: Verify Noto CJK fonts are embedded in the PDFs
        run: |
          status=0
          for theme in scholar classroom midnight notebook terminal; do
            echo "== ${theme}.pdf =="
            pdffonts "output/font-check/${theme}.pdf" | tee "output/font-check/${theme}.fonts.txt"
            if ! grep -qi 'noto.*cjk\|notosans\|notoserif' "output/font-check/${theme}.fonts.txt"; then
              echo "::error::${theme}.pdf 沒有嵌入 Noto CJK 字型"
              status=1
            fi
          done
          exit $status

      - name: Upload font-check PDFs
        uses: actions/upload-artifact@v6
        with:
          name: font-check-pdfs
          path: output/font-check/*.pdf
          retention-days: 7

      - name: Upload output artifacts
        uses: actions/upload-artifact@v6
        with:
          name: smoke-output
          path: output/
          retention-days: 7
